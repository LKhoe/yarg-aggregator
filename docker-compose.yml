services:
  yarg-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/yarg_db
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # App
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # Better Auth
      - BETTER_AUTH_SECRET=sp4zlaU4dTteE3ckze+/W2o1fbMDVOLdfEIeTzvCAas=
      - BETTER_AUTH_URL=http://localhost:3000
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - yarg-network
      # - tunnel

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=yarg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - yarg-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - yarg-network

volumes:
  postgres_data:
  redis_data:

networks:
  yarg-network:
    driver: bridge
  # tunnel:
  #   external: true
