# YARG Aggregator — app only.
# Postgres, Redis and the LLM gateway are provided by the LocalInfra project (../LocalInfra):
# start it first, then provision this app once with  scripts/new-project.sh yarg
# and copy the printed variables into this project's .env.
services:
  yarg-aggregator:
    container_name: yarg-aggregator
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Database — LocalInfra Postgres; DATABASE_URL carries this app's own role
      # (create it with: LocalInfra/scripts/new-project.sh yarg)
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - POSTGRES_HOST=${POSTGRES_HOST:-localinfra-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      # Redis — LocalInfra Redis; ACL user limited to keys/channels "yarg:*"
      - REDIS_HOST=${REDIS_HOST:-localinfra-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-yarg}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-yarg:}
      # App
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
      # Better Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Spotify OAuth
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      # Apple
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      - APPLE_MUSIC_KEY_ID=${APPLE_MUSIC_KEY_ID}
      - APPLE_MUSIC_PRIVATE_KEY=${APPLE_MUSIC_PRIVATE_KEY}
      # Last.fm
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET}
      # Music Platform APIs
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SOUNDCLOUD_CLIENT_ID=${SOUNDCLOUD_CLIENT_ID}
      # LLM (admin agent) — LocalInfra's LLM gateway (provision-app.sh --llm)
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localinfra-llm:4000/v1}
      - LLM_API_KEY=${LLM_API_KEY}
    labels:
      # Shown on the Container Health page (resource map, guides)
      - localinfra.url=${NEXT_PUBLIC_APP_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - localinfra_postgres
      - localinfra_redis
      - localinfra_llm
      # LocalInfra's Cloudflare tunnel reaches the app here: http://yarg-aggregator:3000
      - localinfra_tunnel
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created by the LocalInfra project (start it first)
  localinfra_postgres:
    external: true
  localinfra_redis:
    external: true
  localinfra_llm:
    external: true
  localinfra_tunnel:
    external: true
